<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#153531;
    --felt-2:#0f2825;
    --parchment:#f3ecdc;
    --parchment-dim:#e6ddc6;
    --ink:#20241f;
    --gold:#c9a24b;
    --gold-bright:#e0bc6c;
    --crimson:#b33a32;
    --teamA:#7fa383;
    --teamB:#6f95bb;
    --line:rgba(243,236,220,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--felt);color:var(--parchment);font-family:'Work Sans',sans-serif;min-height:100vh;}
  body::before{content:"";position:fixed;inset:0;background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,0.05), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(0,0,0,0.25), transparent 50%);
    pointer-events:none;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:700;margin:0;}
  .mono{font-family:'Space Mono',monospace;}
  button{font-family:'Work Sans',sans-serif;cursor:pointer;border:none;border-radius:8px;transition:transform .12s ease, background .15s ease;}
  button:active{transform:scale(0.97);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  input{font-family:'Work Sans',sans-serif;}
  .btn-primary{background:var(--gold);color:#1c1408;font-weight:600;padding:12px 22px;font-size:15px;}
  .btn-primary:hover:not(:disabled){background:var(--gold-bright);}
  .btn-secondary{background:transparent;border:1.5px solid var(--line);color:var(--parchment);padding:12px 22px;font-size:15px;}
  .btn-secondary:hover:not(:disabled){border-color:var(--gold);color:var(--gold-bright);}
  .btn-small{padding:6px 12px;font-size:13px;background:rgba(243,236,220,0.1);color:var(--parchment);border:1px solid var(--line);}
  .btn-small:hover:not(:disabled){border-color:var(--gold);}
  #app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px 20px 60px;}

  /* ---------- HOME ---------- */
  .home-wrap{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;}
  .home-title{font-size:clamp(56px,12vw,96px);letter-spacing:-2px;color:var(--parchment);line-height:0.9;}
  .home-title em{font-style:normal;color:var(--gold-bright);}
  .home-sub{color:var(--parchment-dim);font-size:15px;letter-spacing:2px;text-transform:uppercase;margin-bottom:34px;opacity:.7;}
  .ledger{display:flex;gap:6px;margin:18px 0 36px;}
  .ledger .tok{width:22px;height:30px;border-radius:3px;background:rgba(243,236,220,0.12);border:1px solid var(--line);}
  .name-row{display:flex;gap:10px;margin-bottom:22px;}
  .name-row input{padding:11px 14px;border-radius:8px;border:1.5px solid var(--line);background:rgba(0,0,0,0.2);color:var(--parchment);font-size:15px;width:240px;}
  .name-row input:focus{outline:none;border-color:var(--gold);}
  .home-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .join-row{display:flex;gap:8px;margin-top:14px;}
  .join-row input{padding:11px 14px;border-radius:8px;border:1.5px solid var(--line);background:rgba(0,0,0,0.2);color:var(--parchment);font-size:15px;width:140px;text-transform:uppercase;letter-spacing:3px;text-align:center;font-family:'Space Mono',monospace;}
  .home-note{margin-top:40px;font-size:12.5px;color:var(--parchment-dim);opacity:.55;max-width:440px;line-height:1.5;}

  /* ---------- LOBBY ---------- */
  .panel{background:var(--felt-2);border:1px solid var(--line);border-radius:14px;padding:26px;}
  .lobby-code{font-family:'Space Mono',monospace;font-size:34px;letter-spacing:8px;color:var(--gold-bright);background:rgba(0,0,0,0.25);padding:12px 20px;border-radius:10px;display:inline-block;}
  .seat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;}
  .seat-card{border:1.5px solid var(--line);border-radius:10px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .seat-card.empty{opacity:.5;border-style:dashed;}
  .seat-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}
  .team-a .seat-dot,.chip-a{background:var(--teamA);}
  .team-b .seat-dot,.chip-b{background:var(--teamB);}

  /* ---------- GAME ---------- */
  .game-grid{display:grid;grid-template-columns:230px 1fr;gap:18px;}
  @media (max-width:820px){.game-grid{grid-template-columns:1fr;}}
  .ledger-strip{display:flex;gap:5px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  .ledger-tok{width:30px;height:42px;border-radius:4px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'Space Mono',monospace;text-align:center;line-height:1.1;padding:2px;background:rgba(0,0,0,0.2);color:var(--parchment-dim);}
  .ledger-tok.won-a{background:var(--teamA);color:#0e1a10;border-color:var(--teamA);}
  .ledger-tok.won-b{background:var(--teamB);color:#0d1620;border-color:var(--teamB);}
  .sidebar{display:flex;flex-direction:column;gap:8px;}
  .player-row{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;}
  .player-row.active-turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 14px rgba(201,162,75,0.35);}
  .player-row .pname{display:flex;align-items:center;gap:2px;font-weight:500;}
  .player-row .pcount{font-family:'Space Mono',monospace;color:var(--parchment-dim);}
  .score-strip{display:flex;gap:10px;margin-top:6px;font-size:12.5px;}
  .score-strip span{display:flex;align-items:center;gap:5px;}
  .board-main{display:flex;flex-direction:column;gap:16px;}
  .banner{background:rgba(201,162,75,0.14);border:1px solid var(--gold);border-radius:10px;padding:10px 16px;font-size:14px;color:var(--gold-bright);}
  .log{background:rgba(0,0,0,0.22);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:70px;font-family:'Space Mono',monospace;font-size:14px;line-height:1.9;display:flex;flex-direction:column-reverse;}
  .log-entry{opacity:0.9;border-bottom:1px dotted rgba(243,236,220,0.08);padding:3px 0;}
  .log-entry.win{color:var(--gold-bright);font-weight:700;}
  .log-entry.fail{color:#e08f88;}

  .controls{background:var(--felt-2);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .controls h3{font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold-bright);margin-bottom:12px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  select{padding:9px 10px;border-radius:7px;border:1.5px solid var(--line);background:rgba(0,0,0,0.25);color:var(--parchment);font-size:13.5px;}
  .actions-bottom{display:flex;gap:10px;flex-wrap:wrap;}

  .hand-wrap{display:flex;flex-direction:column;gap:8px;}
  .hand-label{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--parchment-dim);}
  .hand{display:flex;gap:6px;flex-wrap:wrap;}
  .card{width:52px;height:74px;border-radius:6px;background:var(--parchment);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 3px 6px rgba(0,0,0,0.35);transition:transform .12s ease;border:1px solid rgba(0,0,0,0.15);}
  .card:hover{transform:translateY(-4px);}
  .card.red{color:var(--crimson);}
  .card.set-marker{width:auto;padding:3px 8px;height:auto;font-size:11px;border-radius:5px;}
  .card-back{width:30px;height:42px;border-radius:4px;background:linear-gradient(135deg,#7a5a2a,#4d3a1c);border:1px solid rgba(0,0,0,0.3);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--felt-2);border:1px solid var(--gold);border-radius:14px;padding:24px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;}
  .assign-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line);}
  .assign-row select{flex:1;}
  .end-screen{text-align:center;padding:60px 20px;}
  .link-btn{background:none;border:none;color:var(--gold-bright);text-decoration:underline;font-size:13px;cursor:pointer;}
  .small-dim{font-size:12px;color:var(--parchment-dim);opacity:.65;}
</style>

</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/cards.js"></script>
<script src="/app.js"></script>
</body>
</html>
