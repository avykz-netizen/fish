<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#153531;
    --felt-2:#0f2825;
    --parchment:#f3ecdc;
    --parchment-dim:#e6ddc6;
    --ink:#20241f;
    --gold:#c9a24b;
    --gold-bright:#e0bc6c;
    --crimson:#b33a32;

  *{box-sizing:border-box;}
  body{margin:0;background:var(--felt);color:var(--parchment);font-family:'Work Sans',sans-serif;min-height:100vh;}
  body::before{content:"";position:fixed;inset:0;background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,0.05), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(0,0,0,0.25), transparent 50%);
    pointer-events:none;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:700;margin:0;}
  .mono{font-family:'Space Mono',monospace;}
  button{font-family:'Work Sans',sans-serif;cursor:pointer;border:none;border-radius:8px;transition:transform .12s ease, background .15s ease;}
  button:active{transform:scale(0.97);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  input{font-family:'Work Sans',sans-serif;}
  .btn-primary{background:var(--gold);color:#1c1408;font-weight:600;padding:12px 22px;font-size:15px;}
  .btn-primary:hover:not(:disabled){background:var(--gold-bright);}
  .btn-secondary{background:transparent;border:1.5px solid var(--line);color:var(--parchment);padding:12px 22px;font-size:15px;}
  .btn-secondary:hover:not(:disabled){border-color:var(--gold);color:var(--gold-bright);}
  .btn-small{padding:6px 12px;font-size:13px;background:rgba(243,236,220,0.1);color:var(--parchment);border:1px solid var(--line);}
  .btn-small:hover:not(:disabled){border-color:var(--gold);}
  #app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px 20px 60px;}

  /* ---------- HOME ---------- */
  .home-wrap{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;}
  .home-title{font-size:clamp(56px,12vw,96px);letter-spacing:-2px;color:var(--parchment);line-height:0.9;}
  .home-title em{font-style:normal;color:var(--gold-bright);}
  .home-sub{color:var(--parchment-dim);font-size:15px;letter-spacing:2px;text-transform:uppercase;margin-bottom:34px;opacity:.7;}
  .ledger{display:flex;gap:6px;margin:18px 0 36px;}
  .ledger .tok{width:22px;height:30px;border-radius:3px;background:rgba(243,236,220,0.12);border:1px solid var(--line);}
  .name-row{display:flex;gap:10px;margin-bottom:22px;}
  .name-row input{padding:11px 14px;border-radius:8px;border:1.5px solid var(--line);background:rgba(0,0,0,0.2);color:var(--parchment);font-size:15px;width:240px;}
  .name-row input:focus{outline:none;border-color:var(--gold);}
  .home-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .join-row{display:flex;gap:8px;margin-top:14px;}
  .join-row input{padding:11px 14px;border-radius:8px;border:1.5px solid var(--line);background:rgba(0,0,0,0.2);color:var(--parchment);font-size:15px;width:140px;text-transform:uppercase;letter-spacing:3px;text-align:center;font-family:'Space Mono',monospace;}
  .home-note{margin-top:40px;font-size:12.5px;color:var(--parchment-dim);opacity:.55;max-width:440px;line-height:1.5;}

  /* ---------- LOBBY ---------- */
  .panel{background:var(--felt-2);border:1px solid var(--line);border-radius:14px;padding:26px;}
  .lobby-code{font-family:'Space Mono',monospace;font-size:34px;letter-spacing:8px;color:var(--gold-bright);background:rgba(0,0,0,0.25);padding:12px 20px;border-radius:10px;display:inline-block;}
  .seat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;}
  .seat-card{border:1.5px solid var(--line);border-radius:10px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .seat-card.empty{opacity:.5;border-style:dashed;}
  .seat-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}
  .team-a .seat-dot,.chip-a{background:var(--teamA);}
  .team-b .seat-dot,.chip-b{background:var(--teamB);}

  /* ---------- GAME ---------- */
  .game-grid{display:grid;grid-template-columns:230px 1fr;gap:18px;}
  @media (max-width:820px){.game-grid{grid-template-columns:1fr;}}
  .ledger-strip{display:flex;gap:5px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  .ledger-tok{width:30px;height:42px;border-radius:4px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'Space Mono',monospace;text-align:center;line-height:1.1;padding:2px;background:rgba(0,0,0,0.2);color:var(--parchment-dim);}
  .ledger-tok.won-a{background:var(--teamA);color:#0e1a10;border-color:var(--teamA);}
  .ledger-tok.won-b{background:var(--teamB);color:#0d1620;border-color:var(--teamB);}
  .sidebar{display:flex;flex-direction:column;gap:8px;}
  .player-row{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;}
  .player-row.active-turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 14px rgba(201,162,75,0.35);}
  .player-row .pname{display:flex;align-items:center;gap:2px;font-weight:500;}

  .score-strip{display:flex;gap:10px;margin-top:6px;font-size:12.5px;}
  .score-strip span{display:flex;align-items:center;gap:5px;}
  .board-main{display:flex;flex-direction:column;gap:16px;}
  .banner{background:rgba(201,162,75,0.14);border:1px solid var(--gold);border-radius:10px;padding:10px 16px;font-size:14px;color:var(--gold-bright);}
  .log{background:rgba(0,0,0,0.22);border:1px solid var(--line);border-radius:10px;padding:12px 16px;height:190px;overflow-y:auto;font-family:'Space Mono',monospace;font-size:12.5px;line-height:1.7;display:flex;flex-direction:column-reverse;}

  .log-entry.win{color:var(--gold-bright);font-weight:700;}

  .controls{background:var(--felt-2);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .controls h3{font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold-bright);margin-bottom:12px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  select{padding:9px 10px;border-radius:7px;border:1.5px solid var(--line);background:rgba(0,0,0,0.25);color:var(--parchment);font-size:13.5px;}
  .actions-bottom{display:flex;gap:10px;flex-wrap:wrap;}

  .hand-wrap{display:flex;flex-direction:column;gap:8px;}
  .hand-label{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--parchment-dim);}
  .hand{display:flex;gap:6px;flex-wrap:wrap;}
  .card{width:52px;height:74px;border-radius:6px;background:var(--parchment);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 3px 6px rgba(0,0,0,0.35);transition:transform .12s ease;border:1px solid rgba(0,0,0,0.15);}
  .card:hover{transform:translateY(-4px);}
  .card.red{color:var(--crimson);}
  .card.set-marker{width:auto;padding:3px 8px;height:auto;font-size:11px;border-radius:5px;}
  .card-back{width:30px;height:42px;border-radius:4px;background:linear-gradient(135deg,#7a5a2a,#4d3a1c);border:1px solid rgba(0,0,0,0.3);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--felt-2);border:1px solid var(--gold);border-radius:14px;padding:24px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;}
  .assign-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dotted var(--line);}
  .assign-row select{flex:1;}
  .end-screen{text-align:center;padding:60px 20px;}
  .link-btn{background:none;border:none;color:var(--gold-bright);text-decoration:underline;font-size:13px;cursor:pointer;}
  .small-dim{font-size:12px;color:var(--parchment-dim);opacity:.65;}
</style>

<body>
<div id="app"></div>

<script>
/* ============================= CARD / SET DEFINITIONS ============================= */
const SUITS = ['S','H','D','C'];
const SUIT_SYMBOL = {S:'\u2660',H:'\u2665',D:'\u2666',C:'\u2663'};
const SUIT_NAME = {S:'Spades',H:'Hearts',D:'Diamonds',C:'Clubs'};
const RED_SUITS = new Set(['H','D']);
const LOW_RANKS = ['2','3','4','5','6','7'];
const HIGH_RANKS = ['9','10','J','Q','K','A'];

function buildDeck(){
  const deck = [];
  for(const suit of SUITS){
    for(const rank of LOW_RANKS) deck.push({id:rank+suit, rank, suit, setId:'low-'+suit});
    for(const rank of HIGH_RANKS) deck.push({id:rank+suit, rank, suit, setId:'high-'+suit});
    deck.push({id:'8'+suit, rank:'8', suit, setId:'mid'});
  }
  deck.push({id:'JOKER_R', rank:'JOKER', suit:'R', setId:'mid'});
  deck.push({id:'JOKER_B', rank:'JOKER', suit:'B', setId:'mid'});
  return deck;
}
const DECK = buildDeck();
const CARD_BY_ID = Object.fromEntries(DECK.map(c=>[c.id,c]));

const SET_IDS = [
  'low-S','low-H','low-D','low-C',
  'high-S','high-H','high-D','high-C',
  'mid'
];
function setLabel(setId){
  if(setId==='mid') return 'Eights & Jokers';
  const [tier,suit] = setId.split('-');
  return (tier==='low'?'Low ':'High ') + SUIT_NAME[suit] + (tier==='low'?' (2\u20137)':' (9\u2013A)');
}
function setCards(setId){ return DECK.filter(c=>c.setId===setId).map(c=>c.id); }
const SET_CARD_IDS = Object.fromEntries(SET_IDS.map(s=>[s, setCards(s)]));

function cardLabel(id){
  const c = CARD_BY_ID[id];
  if(c.rank==='JOKER') return (c.suit==='R'?'Red':'Black')+' Joker';
  return c.rank + SUIT_SYMBOL[c.suit];
}
function cardIsRed(id){
  const c = CARD_BY_ID[id];
  if(c.rank==='JOKER') return c.suit==='R';
  return RED_SUITS.has(c.suit);
}
function shortSetTok(setId){
  if(setId==='mid') return '8s+J';
  const [tier,suit]=setId.split('-');
  return (tier==='low'?'Lo':'Hi')+SUIT_SYMBOL[suit];
}

/* seed-free shuffle (local use only) */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ============================= GAME ENGINE (pure-ish, mutates game obj) ============================= */
// game = { seats:[{seat,name,isBot,team}], hands:{0:[ids],...}, turn, log:[], scores:{A:[],B:[]}, discard:{setId:'A'|'B'}, phase, winner, pendingPass }

function teamOf(seat){ return seat%2===0 ? 'A':'B'; }
function teammates(seat){ const t=teamOf(seat); const res=[]; for(let s=0;s<6;s++) if(s!==seat && teamOf(s)===t) res.push(s); return res; }
function opponents(seat){ const t=teamOf(seat); const res=[]; for(let s=0;s<6;s++) if(teamOf(s)!==t) res.push(s); return res; }

function newGame(seatMeta){
  const deck = shuffle(DECK.map(c=>c.id));
  const hands = {};
  for(let s=0;s<6;s++) hands[s]=[];
  deck.forEach((cid,i)=>{ hands[i%6].push(cid); });
  for(let s=0;s<6;s++) hands[s].sort(cardSortKey);
  const pub = {known:{}, possible:{}, flip:{}};
  for(const c of DECK) pub.possible[c.id] = new Set([0,1,2,3,4,5]);
  return {
    seats: seatMeta, hands, turn:0,
    log:[{type:'system', text:'Cards dealt. '+seatMeta[0].name+' goes first.'}],
    scores:{A:[],B:[]}, discard:{}, phase:'playing', winner:null, pendingPass:false,
    actionCount:0, _pub: pub
  };
}

/* keep the public (viewer-independent) belief cache in sync with hand sizes hitting zero */
function refreshPubForEmptyHands(game){
  for(let s=0;s<6;s++){
    if(game.hands[s].length>0) continue;
    for(const cid in game._pub.possible){
      const poss = game._pub.possible[cid];
      if(poss.delete(s) && poss.size===1 && game._pub.known[cid]===undefined){
        game._pub.known[cid] = [...poss][0];
      }
    }
  }
}
function cardSortKey(a,b){
  const ca=CARD_BY_ID[a], cb=CARD_BY_ID[b];
  if(ca.setId!==cb.setId) return SET_IDS.indexOf(ca.setId)-SET_IDS.indexOf(cb.setId);
  return DECK.findIndex(c=>c.id===a) - DECK.findIndex(c=>c.id===b);
}

function activeSets(game){ return SET_IDS.filter(s=>!game.discard[s]); }

function legalAskTargets(game, seat){
  // returns list of {setId, cardId, target}
  const out=[];
  const hand = game.hands[seat];
  const heldSets = new Set(hand.map(c=>CARD_BY_ID[c].setId));
  const oppList = opponents(seat).filter(o=>game.hands[o].length>0);
  for(const setId of heldSets){
    if(game.discard[setId]) continue;
    for(const cid of SET_CARD_IDS[setId]){
      if(hand.includes(cid)) continue;
      for(const t of oppList) out.push({setId, cardId:cid, target:t});
    }
  }
  return out;
}

function applyAsk(game, asker, target, cardId){
  game.actionCount = (game.actionCount||0)+1;
  const has = game.hands[target].includes(cardId);
  if(has){
    game.hands[target] = game.hands[target].filter(c=>c!==cardId);
    game.hands[asker].push(cardId);
    game.hands[asker].sort(cardSortKey);
    game.log.push({type:'ask', asker, target, cardId, result:'yes'});
    game._pub.known[cardId] = asker;
    delete game._pub.possible[cardId];
    game._pub.flip[cardId] = (game._pub.flip[cardId]||0) + 1;
  } else {
    game.log.push({type:'ask', asker, target, cardId, result:'no'});
    game.turn = target;
    const poss = game._pub.possible[cardId];
    if(poss){
      poss.delete(target);
      if(poss.size===1 && game._pub.known[cardId]===undefined) game._pub.known[cardId]=[...poss][0];
    }
  }
  refreshPubForEmptyHands(game);
  checkAutoPass(game);
  return has;
}

function checkAutoPass(game){
  const cur = game.turn;
  if(game.hands[cur].length>0) return;
  const mates = teammates(cur).filter(m=>game.hands[m].length>0);
  if(mates.length>0){
    game.pendingPass = true; // UI/bot must choose who to pass to
  } else {
    game.pendingPass = false; // whole team empty-handed; handled by declare-phase banner
  }
}

function applyPass(game, from, to){
  game.log.push({type:'pass', from, to});
  game.turn = to;
  game.pendingPass = false;
}

// assignment: {cardId: seat} must cover all 6 cards of the set, seat must be declarer or a teammate
function applyDeclare(game, byseat, setId, assignment){
  const team = teamOf(byseat);
  const mates = new Set([byseat, ...teammates(byseat)]);
  let success = true;
  for(const cid of SET_CARD_IDS[setId]){
    const claimedSeat = assignment[cid];
    if(claimedSeat===undefined || !mates.has(Number(claimedSeat))){ success=false; continue; }
    const trueSeat = seatHolding(game, cid);
    if(trueSeat !== Number(claimedSeat)) success=false;
  }
  const winningTeam = success ? team : (team==='A'?'B':'A');
  game.discard[setId] = winningTeam;
  game.scores[winningTeam].push(setId);
  // remove set cards from all hands
  for(const cid of SET_CARD_IDS[setId]){
    for(let s=0;s<6;s++) game.hands[s]=game.hands[s].filter(c=>c!==cid);
  }
  game.log.push({type:'declare', by:byseat, team, setId, assignment, success, winningTeam});
  for(const cid of SET_CARD_IDS[setId]){ game._pub.known[cid]='discarded'; delete game._pub.possible[cid]; }
  refreshPubForEmptyHands(game);
  checkAutoPass(game);
  if(game.scores[winningTeam].length>=5){
    game.phase='ended'; game.winner=winningTeam;
  }
  return {success, winningTeam};
}

/* Safety valve: if a game runs unreasonably long (only possible in edge-case
   all-bot standoffs), force-resolve remaining sets by majority holder so the
   game always terminates rather than running forever. */
function forceResolveGame(game){
  for(const setId of activeSets(game)){
    const counts = {A:0,B:0};
    for(const cid of SET_CARD_IDS[setId]){
      const holder = seatHolding(game, cid);
      if(holder!==null) counts[teamOf(holder)]++;
    }
    const winningTeam = counts.A===counts.B ? (Math.random()<0.5?'A':'B') : (counts.A>counts.B?'A':'B');
    game.discard[setId]=winningTeam;
    game.scores[winningTeam].push(setId);
    for(const cid of SET_CARD_IDS[setId]) for(let s=0;s<6;s++) game.hands[s]=game.hands[s].filter(c=>c!==cid);
    game.log.push({type:'system', text:'The '+setLabel(setId)+' set was too contested to resolve normally, so it went to Team '+winningTeam+' by majority hold.'});
  }
  game.phase='ended';
  game.winner = game.scores.A.length>=game.scores.B.length ? 'A':'B';
}

function seatHolding(game, cardId){
  for(let s=0;s<6;s++) if(game.hands[s].includes(cardId)) return s;
  return null;
}

function bothTeamsCardCounts(game){
  const c={A:0,B:0};
  for(let s=0;s<6;s++) c[teamOf(s)] += game.hands[s].length;
  return c;
}

/* ---------- Belief model (public-info only, used by bots) ----------
   Public (viewer-independent) knowledge is maintained incrementally on
   game._pub as events happen (see applyAsk/applyDeclare), so this stays
   O(54) per call no matter how long the game log gets. */
function computeBelief(game, viewerSeat){
  const myHand = new Set(game.hands[viewerSeat]);
  const known = {};
  const possible = {};
  for(const c of DECK){
    if(myHand.has(c.id)){ known[c.id]=viewerSeat; continue; }
    const pk = game._pub.known[c.id];
    if(pk!==undefined){ known[c.id]=pk; continue; }
    const poss = new Set(game._pub.possible[c.id] || []);
    poss.delete(viewerSeat);
    possible[c.id] = poss;
  }
  return {known, possible};
}

function botChooseAsk(game, seat){
  const {known, possible} = computeBelief(game, seat);
  const hand = game.hands[seat];
  const heldSets = new Set(hand.map(c=>CARD_BY_ID[c].setId));
  const opp = new Set(opponents(seat).filter(o=>game.hands[o].length>0));
  const candidates = []; // {cardId, target, p}
  for(const setId of heldSets){
    if(game.discard[setId]) continue;
    for(const cid of SET_CARD_IDS[setId]){
      if(hand.includes(cid)) continue;
      const k = known[cid];
      if(k==='discarded') continue;
      // A card that keeps flip-flopping between teams is a trap: damp its
      // priority so bots don't get stuck endlessly stealing it back and forth.
      const flips = game._pub.flip[cid] || 0;
      const damp = flips>=2 ? Math.pow(0.35, flips-1) : 1;
      if(typeof k === 'number'){
        if(opp.has(k)) candidates.push({cardId:cid, target:k, p:1*damp});
        continue;
      }
      const poss = possible[cid] ? [...possible[cid]].filter(s=>opp.has(s)) : [];
      if(poss.length===0) continue;
      const p = (1/poss.length)*damp;
      for(const t of poss) candidates.push({cardId:cid, target:t, p});
    }
  }
  if(candidates.length===0){
    const legal = legalAskTargets(game, seat);
    if(legal.length===0) return null;
    const pick = legal[Math.floor(Math.random()*legal.length)];
    return {cardId:pick.cardId, target:pick.target};
  }
  // Mostly play the best move, but keep enough randomness that two rivals
  // contesting a single "certain" card can't loop on it forever.
  const maxP = Math.max(...candidates.map(c=>c.p));
  const best = candidates.filter(c=>c.p===maxP);
  const pool = Math.random() < 0.72 ? best : candidates;
  return pool[Math.floor(Math.random()*pool.length)];
}

function botFindDeclare(game, seat){
  const {known} = computeBelief(game, seat);
  const mates = new Set([seat, ...teammates(seat)]);
  for(const setId of activeSets(game)){
    const assignment = {};
    let sure = true;
    for(const cid of SET_CARD_IDS[setId]){
      const k = known[cid];
      if(typeof k === 'number' && mates.has(k)){ assignment[cid]=k; }
      else { sure=false; break; }
    }
    if(sure) return {setId, assignment};
  }
  return null;
}

/* ============================= APP STATE ============================= */
const S = {
  screen:'home',       // home | lobby | game
  mode:null,            // 'local' | 'online-host' | 'online-guest'
  myName:'',
  mySeat:0,
  roomCode:null,
  room:null,            // shared room object (online modes)
  game:null,            // local game object (local mode) OR mirrors room.game (online)
  pollTimer:null,
  botTimer:null,
  ui:{ askTarget:'', askSet:'', askCard:'', declareOpen:false, declareSet:null, declareAssign:{}, passOpen:false, joinCode:'' }
};

function render(){
  const app = document.getElementById('app');
  if(S.screen==='home') app.innerHTML = renderHome();
  else if(S.screen==='lobby') app.innerHTML = renderLobby();
  else if(S.screen==='game') app.innerHTML = renderGame();
  attachHandlers();
}

function ensureName(){
  if(!S.myName || !S.myName.trim()){ S.myName = 'Player'+Math.floor(Math.random()*90+10); }
}

function startBotsGame(){
  ensureName();
  const names = [S.myName,'Bea','Casper','Dot','Ezra','Fig'];
  const seats = [0,1,2,3,4,5].map(s=>({seat:s, name:names[s], isBot:s!==0, team:teamOf(s)}));
  S.mode='local'; S.mySeat=0; S.roomCode=null;
  S.game = newGame(seats);
  S.screen='game';
  render();
  maybeRunBotLoop();
}

/* ---------- ONLINE: storage helpers ---------- */
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<5;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
async function roomGet(code){
  try{ const r = await window.storage.get('fish:room:'+code, true); return r? JSON.parse(r.value): null; }
  catch(e){ return null; }
}
async function roomSet(code, obj){
  obj.updatedAt = Date.now();
  try{ await window.storage.set('fish:room:'+code, JSON.stringify(obj), true); return true; }
  catch(e){ return false; }
}

async function createRoom(){
  ensureName();
  const code = genCode();
  const seats = [{seat:0,name:S.myName,isBot:false,team:'A',present:true}];
  for(let s=1;s<6;s++) seats.push({seat:s,name:'',isBot:false,team:teamOf(s),present:false});
  const room = { code, phase:'lobby', seats, hostSeat:0, game:null, actionQueue:[], version:0 };
  await roomSet(code, room);
  S.mode='online-host'; S.mySeat=0; S.roomCode=code; S.room=room;
  S.screen='lobby';
  render();
  startPolling();
}

async function joinRoom(){
  ensureName();
  const code = (S.ui.joinCode||'').trim().toUpperCase();
  if(!code){ alert('Enter a room code.'); return; }
  const room = await roomGet(code);
  if(!room){ alert('No room found with that code.'); return; }
  if(room.phase!=='lobby'){ alert('That game has already started.'); return; }
  const openSeat = room.seats.find(s=>!s.present && !s.isBot);
  if(!openSeat){ alert('That room is full.'); return; }
  openSeat.name = S.myName; openSeat.present = true; openSeat.isBot=false;
  room.version++;
  await roomSet(code, room);
  S.mode='online-guest'; S.mySeat=openSeat.seat; S.roomCode=code; S.room=room;
  S.screen='lobby';
  render();
  startPolling();
}

function startPolling(){
  stopPolling();
  S.pollTimer = setInterval(pollRoom, 1800);
}
function stopPolling(){ if(S.pollTimer) clearInterval(S.pollTimer); S.pollTimer=null; }

async function pollRoom(){
  if(!S.roomCode) return;
  const room = await roomGet(S.roomCode);
  if(!room) return;
  const changed = !S.room || room.updatedAt !== S.room.updatedAt;
  S.room = room;
  if(room.phase==='playing' || room.phase==='ended'){
    if(S.screen!=='game'){ S.screen='game'; }
    if(S.mode==='online-host'){
      hostRefereeTick();
    }
  }
  if(changed) render();
}

/* host-only: consumes queued guest actions and runs bot turns against authoritative game */
async function hostRefereeTick(){
  const room = S.room;
  if(!room || !room.game || room.phase!=='playing') return;
  let dirty = false;
  if(room.actionQueue && room.actionQueue.length){
    const queue = room.actionQueue; room.actionQueue = [];
    for(const act of queue){
      applyHostAction(room.game, act);
      dirty = true;
    }
  }
  dirty = runBotsToCompletion(room.game) || dirty;
  if(dirty){
    room.version++;
    await roomSet(S.roomCode, room);
    S.room = room;
    render();
  }
}

function applyHostAction(game, act){
  if(game.phase!=='playing') return;
  if(act.type==='ASK'){
    if(game.turn!==act.seat) return;
    if(!game.hands[act.seat].includes(act.cardId) && legalAskTargets(game, act.seat).some(l=>l.cardId===act.cardId && l.target===act.target)){
      applyAsk(game, act.seat, act.target, act.cardId);
    }
  } else if(act.type==='DECLARE'){
    applyDeclare(game, act.seat, act.setId, act.assignment);
  } else if(act.type==='PASS'){
    if(game.pendingPass && teammates(act.seat).includes(act.to) === false && act.to!==act.seat) return;
    applyPass(game, act.seat, act.to);
  }
}

/* runs bot decisions synchronously until it's a human's turn / declare opportunities exhausted */
function runBotsToCompletion(game){
  let dirty=false;
  let guard=0;
  while(game.phase==='playing' && guard<200){
    guard++;
    if(game.actionCount>900){ forceResolveGame(game); dirty=true; break; }
    // auto declare opportunities for bots on any active set
    let declared=false;
    for(let s=0;s<6;s++){
      if(!game.seats[s].isBot) continue;
      const d = botFindDeclare(game, s);
      if(d){ applyDeclare(game, s, d.setId, d.assignment); declared=true; dirty=true; break; }
    }
    if(declared) continue;
    if(game.phase!=='playing') break;
    if(game.pendingPass){
      const cur = game.turn;
      if(game.seats[cur].isBot){
        const mates = teammates(cur).filter(m=>game.hands[m].length>0);
        if(mates.length){ applyPass(game, cur, mates[0]); dirty=true; continue; }
      }
      break; // waiting on human to choose pass target
    }
    const cur = game.turn;
    if(!game.seats[cur].isBot) break; // wait for human
    if(game.hands[cur].length===0) break;
    const choice = botChooseAsk(game, cur);
    if(!choice) break;
    applyAsk(game, cur, choice.target, choice.cardId);
    dirty = true;
  }
  return dirty;
}

/* local mode bot loop */
function maybeRunBotLoop(){
  if(S.mode!=='local' || !S.game) return;
  if(S.botTimer) clearTimeout(S.botTimer);
  let streak = 0; // consecutive bot-only actions, used to speed up boring stretches
  const step = ()=>{
    if(!S.game || S.game.phase!=='playing') { render(); return; }
    const g = S.game;
    if(g.actionCount>900){ forceResolveGame(g); render(); return; }
    let acted=false;
    for(let s=0;s<6;s++){
      if(!g.seats[s].isBot) continue;
      const d = botFindDeclare(g, s);
      if(d){ applyDeclare(g,s,d.setId,d.assignment); acted=true; break; }
    }
    if(!acted){
      if(g.pendingPass){
        const cur=g.turn;
        if(g.seats[cur].isBot){
          const mates=teammates(cur).filter(m=>g.hands[m].length>0);
          if(mates.length){ applyPass(g,cur,mates[0]); acted=true; }
        }
      } else if(g.seats[g.turn].isBot && g.hands[g.turn].length>0){
        const choice = botChooseAsk(g, g.turn);
        if(choice){ applyAsk(g, g.turn, choice.target, choice.cardId); acted=true; }
      }
    }
    streak = acted ? streak+1 : streak;
    if(g.turn===S.mySeat && !g.pendingPass) streak = 0;
    render();
    if(g.phase==='playing' && (g.seats[g.turn].isBot || g.pendingPass || acted)){
      const delay = streak>25 ? 40 : (streak>6 ? 150 : 550);
      S.botTimer = setTimeout(step, delay);
    }
  };
  S.botTimer = setTimeout(step, 550);
}

/* ---------- LOBBY ---------- */
function renderLobby(){
  const room = S.room;
  if(!room) return '<div class="home-wrap"><h2>Loading room...</h2></div>';
  const isHost = S.mode==='online-host';
  const seatsHtml = room.seats.map(s=>{
    const filled = s.present || s.isBot;
    const label = s.isBot ? (s.name||'Bot')+' \ud83e\udd16' : (s.present ? s.name : 'Waiting for player...');
    const teamClass = teamOf(s.seat)==='A' ? 'team-a' : 'team-b';
    let action = '';
    if(isHost && !s.present && !s.isBot && s.seat!==0){
      action = `<button class="btn-small" data-fillbot="${s.seat}">Fill with bot</button>`;
    } else if(isHost && s.isBot){
      action = `<button class="btn-small" data-clearseat="${s.seat}">Clear</button>`;
    }
    return `<div class="seat-card ${teamClass} ${filled?'':'empty'}">
      <span><span class="seat-dot"></span>Seat ${s.seat+1} \u2014 ${label}</span>
      ${action}
    </div>`;
  }).join('');
  const allFilled = room.seats.every(s=>s.present || s.isBot);
  return `
  <div class="panel" style="max-width:640px;margin:40px auto;">
    <h2 style="margin-bottom:6px;">Lobby</h2>
    <div class="small-dim" style="margin-bottom:14px;">Share this code with friends</div>
    <div class="lobby-code mono">${room.code}</div>
    <div class="seat-grid">${seatsHtml}</div>
    ${isHost ? `<div style="margin-top:22px;display:flex;gap:10px;">
        <button class="btn-primary" id="btnStart" ${allFilled?'':'disabled'}>Start Game</button>
        <span class="small-dim" style="align-self:center;">${allFilled?'':'Fill every seat (or wait for players) to start'}</span>
      </div>`
      : `<div style="margin-top:22px;" class="small-dim">Waiting for the host to start the game...</div>`}
    <div style="margin-top:20px;"><button class="link-btn" id="btnLeaveLobby">Leave</button></div>
  </div>`;
}

function attachLobbyHandlers(){
  document.querySelectorAll('[data-fillbot]').forEach(b=>b.addEventListener('click', async e=>{
    const seat = Number(e.target.dataset.fillbot);
    const botNames=['Bea','Casper','Dot','Ezra','Fig','Gale'];
    const s = S.room.seats.find(x=>x.seat===seat);
    s.isBot=true; s.present=true; s.name = botNames[seat] || ('Bot '+seat);
    S.room.version++;
    await roomSet(S.roomCode, S.room);
    render();
  }));
  document.querySelectorAll('[data-clearseat]').forEach(b=>b.addEventListener('click', async e=>{
    const seat = Number(e.target.dataset.clearseat);
    const s = S.room.seats.find(x=>x.seat===seat);
    s.isBot=false; s.present=false; s.name='';
    S.room.version++;
    await roomSet(S.roomCode, S.room);
    render();
  }));
  const btnStart = document.getElementById('btnStart');
  if(btnStart) btnStart.addEventListener('click', async ()=>{
    const seatMeta = S.room.seats.map(s=>({seat:s.seat,name:s.name||('Seat '+(s.seat+1)),isBot:s.isBot,team:teamOf(s.seat)}));
    const game = newGame(seatMeta);
    S.room.game = game; S.room.phase='playing'; S.room.actionQueue=[]; S.room.version++;
    await roomSet(S.roomCode, S.room);
    S.screen='game';
    render();
  });
  const btnLeave = document.getElementById('btnLeaveLobby');
  if(btnLeave) btnLeave.addEventListener('click', goHome);
}

function goHome(){
  stopPolling();
  if(S.botTimer) clearTimeout(S.botTimer);
  S.screen='home'; S.mode=null; S.room=null; S.roomCode=null; S.game=null;
  render();
}

/* ---------- GAME RENDER ---------- */
function currentGame(){
  return S.mode==='local' ? S.game : (S.room ? S.room.game : null);
}

function renderGame(){
  const g = currentGame();
  if(!g) return '<div class="home-wrap"><h2>Loading game...</h2></div>';
  if(g.phase==='ended') return renderEnd(g);

  const mySeat = S.mySeat;
  const iAmSpectatorBot = g.seats[mySeat].isBot; // shouldn't happen for human viewer
  const myHand = g.hands[mySeat] || [];
  const myTurn = g.turn===mySeat && !iAmSpectatorBot;

  const sidebar = g.seats.map(s=>{
    const active = g.turn===s.seat;
    const teamClass = teamOf(s.seat)==='A'?'chip-a':'chip-b';
    return `<div class="player-row ${active?'active-turn':''}">
      <span class="pname"><span class="seat-dot ${teamClass}"></span>${s.name}${s.isBot?' \ud83e\udd16':''}${s.seat===mySeat?' (you)':''}</span>
      <span class="pcount">${g.hands[s.seat].length} cards</span>
    </div>`;
  }).join('');

  const ledger = SET_IDS.map(setId=>{
    const won = g.discard[setId];
    const cls = won==='A'?'won-a':(won==='B'?'won-b':'');
    return `<div class="ledger-tok ${cls}" title="${setLabel(setId)}">${shortSetTok(setId)}</div>`;
  }).join('');

  const logHtml = g.log.slice().reverse().map(ev=>logLine(ev, g)).join('');

  const counts = bothTeamsCardCounts(g);

  let banner = '';
  if(g.pendingPass && g.turn===mySeat){
    banner = `<div class="banner">You're out of cards \u2014 pass the turn to a teammate.</div>`;
  } else if(g.pendingPass){
    banner = `<div class="banner">${g.seats[g.turn].name} is out of cards and needs to pass to a teammate...</div>`;
  } else if(myTurn){
    banner = `<div class="banner">Your turn \u2014 ask an opponent for a card.</div>`;
  } else if(g.seats[g.turn].isBot){
    banner = `<div class="banner">${g.seats[g.turn].name} is thinking...</div>`;
  } else {
    banner = `<div class="banner">Waiting on ${g.seats[g.turn].name}...</div>`;
  }

  const oppOptions = opponents(mySeat).filter(o=>g.hands[o].length>0)
    .map(o=>`<option value="${o}">${g.seats[o].name}</option>`).join('');
  const heldSets = [...new Set(myHand.map(c=>CARD_BY_ID[c].setId))].filter(s=>!g.discard[s]);
  const setOptions = heldSets.map(s=>`<option value="${s}">${setLabel(s)}</option>`).join('');
  const chosenSet = S.ui.askSet && heldSets.includes(S.ui.askSet) ? S.ui.askSet : heldSets[0];
  const cardOptions = chosenSet ? SET_CARD_IDS[chosenSet].filter(c=>!myHand.includes(c)).map(c=>`<option value="${c}">${cardLabel(c)}</option>`).join('') : '';

  const passOptions = g.pendingPass && g.turn===mySeat ? teammates(mySeat).filter(m=>g.hands[m].length>0).map(m=>`<option value="${m}">${g.seats[m].name}</option>`).join('') : '';

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <h2 style="font-size:22px;">Fish ${S.roomCode?`<span class="mono" style="font-size:14px;color:var(--gold-bright);">${S.roomCode}</span>`:''}</h2>
    <button class="link-btn" id="btnLeaveGame">Leave game</button>
  </div>
  <div class="ledger-strip">${ledger}</div>
  <div class="score-strip" style="justify-content:center;margin-bottom:18px;">
    <span><span class="seat-dot chip-a"></span>Team A: ${g.scores.A.length} sets \u00b7 ${counts.A} cards</span>
    <span><span class="seat-dot chip-b"></span>Team B: ${g.scores.B.length} sets \u00b7 ${counts.B} cards</span>
  </div>
  <div class="game-grid">
    <div class="sidebar">${sidebar}</div>
    <div class="board-main">
      ${banner}
      <div class="log">${logHtml}</div>
      <div class="controls">
        ${g.pendingPass && g.turn===mySeat ? `
          <h3>Pass your turn</h3>
          <div class="row">
            <select id="passTarget">${passOptions}</select>
            <button class="btn-primary" id="btnPass">Pass</button>
          </div>
        ` : myTurn ? `
          <h3>Ask for a card</h3>
          <div class="row">
            <select id="askSet">${setOptions}</select>
            <select id="askCard">${cardOptions}</select>
            <select id="askTarget">${oppOptions}</select>
            <button class="btn-primary" id="btnAsk" ${heldSets.length===0?'disabled':''}>Ask</button>
          </div>
        ` : `<div class="small-dim">You can still declare a set below at any time.</div>`}
        <div class="actions-bottom">
          <button class="btn-secondary" id="btnDeclare">Declare a Set</button>
        </div>
      </div>
      <div class="hand-wrap">
        <div class="hand-label">Your hand \u2014 ${g.seats[mySeat].name}</div>
        <div class="hand">${myHand.map(c=>`<div class="card ${cardIsRed(c)?'red':''}">${cardLabel(c)}</div>`).join('') || '<span class="small-dim">No cards</span>'}</div>
      </div>
    </div>
  </div>
  ${S.ui.declareOpen ? renderDeclareModal(g, mySeat) : ''}
  `;
}

function logLine(ev, g){
  const nameOf = s => (g.seats[s] ? g.seats[s].name : '?');
  if(ev.type==='system') return `<div class="log-entry">${ev.text}</div>`;
  if(ev.type==='ask'){
    const cls = ev.result==='yes' ? '' : 'fail';
    const txt = ev.result==='yes'
      ? `${nameOf(ev.asker)} asked ${nameOf(ev.target)} for ${cardLabel(ev.cardId)} \u2014 got it!`
      : `${nameOf(ev.asker)} asked ${nameOf(ev.target)} for ${cardLabel(ev.cardId)} \u2014 no.`;
    return `<div class="log-entry ${cls}">${txt}</div>`;
  }
  if(ev.type==='pass') return `<div class="log-entry">${nameOf(ev.from)} passed the turn to ${nameOf(ev.to)}.</div>`;
  if(ev.type==='declare'){
    const cls = ev.success ? 'win' : 'fail';
    const txt = `${nameOf(ev.by)} declared ${setLabel(ev.setId)} \u2014 ${ev.success?'correct! Team '+ev.winningTeam+' wins the set.':'misdeclared! Team '+ev.winningTeam+' wins the set.'}`;
    return `<div class="log-entry ${cls}">${txt}</div>`;
  }
  return '';
}

function renderDeclareModal(g, mySeat){
  const mates = [mySeat, ...teammates(mySeat)];
  const options = activeSets(g);
  const chosen = S.ui.declareSet && options.includes(S.ui.declareSet) ? S.ui.declareSet : options[0];
  const rows = chosen ? SET_CARD_IDS[chosen].map(cid=>{
    const cur = S.ui.declareAssign[cid];
    const inMyHand = g.hands[mySeat].includes(cid);
    const val = inMyHand ? mySeat : (cur!==undefined?cur:'');
    return `<div class="assign-row">
      <span>${cardLabel(cid)}</span>
      <select data-assign="${cid}" ${inMyHand?'disabled':''}>
        <option value="">\u2014 choose \u2014</option>
        ${mates.map(m=>`<option value="${m}" ${String(val)===String(m)?'selected':''}>${g.seats[m].name}${m===mySeat?' (you)':''}</option>`).join('')}
      </select>
    </div>`;
  }).join('') : '<div class="small-dim">No active sets left.</div>';

  return `
  <div class="modal-overlay" id="declareOverlay">
    <div class="modal">
      <h3 style="margin-bottom:14px;">Declare a Set</h3>
      <div class="row">
        <select id="declareSetSelect">${options.map(s=>`<option value="${s}" ${s===chosen?'selected':''}>${setLabel(s)}</option>`).join('')}</select>
      </div>
      <div>${rows}</div>
      <div style="display:flex;gap:10px;margin-top:18px;">
        <button class="btn-primary" id="btnConfirmDeclare">Declare</button>
        <button class="btn-secondary" id="btnCancelDeclare">Cancel</button>
      </div>
      <div class="small-dim" style="margin-top:10px;">Assign every card to yourself or a teammate. If any card is actually held by the opposing team, the declare fails and they win the set.</div>
    </div>
  </div>`;
}

function renderEnd(g){
  const winnerName = g.winner==='A' ? 'Team A' : 'Team B';
  return `
  <div class="end-screen">
    <h1 style="font-size:44px;color:var(--gold-bright);">${winnerName} wins!</h1>
    <p class="small-dim" style="margin:14px 0 26px;">Final score \u2014 Team A: ${g.scores.A.length} sets \u00b7 Team B: ${g.scores.B.length} sets</p>
    <div class="ledger-strip" style="justify-content:center;">${SET_IDS.map(s=>{
      const won=g.discard[s]; const cls= won==='A'?'won-a':(won==='B'?'won-b':'');
      return `<div class="ledger-tok ${cls}">${shortSetTok(s)}</div>`;
    }).join('')}</div>
    <button class="btn-primary" style="margin-top:30px;" id="btnPlayAgain">Back to Home</button>
  </div>`;
}

/* ---------- GAME HANDLERS ---------- */
function attachGameHandlers(){
  const btnLeave = document.getElementById('btnLeaveGame');
  if(btnLeave) btnLeave.addEventListener('click', goHome);
  const btnPlayAgain = document.getElementById('btnPlayAgain');
  if(btnPlayAgain) btnPlayAgain.addEventListener('click', goHome);

  const askSet = document.getElementById('askSet');
  if(askSet) askSet.addEventListener('change', e=>{ S.ui.askSet=e.target.value; render(); });
  const btnAsk = document.getElementById('btnAsk');
  if(btnAsk) btnAsk.addEventListener('click', doAsk);

  const btnPass = document.getElementById('btnPass');
  if(btnPass) btnPass.addEventListener('click', doPass);

  const btnDeclare = document.getElementById('btnDeclare');
  if(btnDeclare) btnDeclare.addEventListener('click', ()=>{ S.ui.declareOpen=true; S.ui.declareAssign={}; render(); });
  const btnCancelDeclare = document.getElementById('btnCancelDeclare');
  if(btnCancelDeclare) btnCancelDeclare.addEventListener('click', ()=>{ S.ui.declareOpen=false; render(); });
  const declareSetSelect = document.getElementById('declareSetSelect');
  if(declareSetSelect) declareSetSelect.addEventListener('change', e=>{ S.ui.declareSet=e.target.value; S.ui.declareAssign={}; render(); });
  document.querySelectorAll('[data-assign]').forEach(sel=>sel.addEventListener('change', e=>{
    S.ui.declareAssign[e.target.dataset.assign] = e.target.value;
  }));
  const btnConfirmDeclare = document.getElementById('btnConfirmDeclare');
  if(btnConfirmDeclare) btnConfirmDeclare.addEventListener('click', doDeclare);
}

async function doAsk(){
  const g = currentGame();
  const setId = document.getElementById('askSet').value;
  const cardId = document.getElementById('askCard').value;
  const target = Number(document.getElementById('askTarget').value);
  if(!cardId || isNaN(target)) return;
  if(S.mode==='local'){
    applyAsk(g, S.mySeat, target, cardId);
    render();
    maybeRunBotLoop();
  } else {
    S.room.actionQueue.push({type:'ASK', seat:S.mySeat, target, cardId, ts:Date.now()});
    S.room.version++;
    await roomSet(S.roomCode, S.room);
    if(S.mode==='online-host') hostRefereeTick();
    render();
  }
}

async function doPass(){
  const g = currentGame();
  const to = Number(document.getElementById('passTarget').value);
  if(isNaN(to)) return;
  if(S.mode==='local'){
    applyPass(g, S.mySeat, to);
    render();
    maybeRunBotLoop();
  } else {
    S.room.actionQueue.push({type:'PASS', seat:S.mySeat, to, ts:Date.now()});
    S.room.version++;
    await roomSet(S.roomCode, S.room);
    if(S.mode==='online-host') hostRefereeTick();
    render();
  }
}

async function doDeclare(){
  const g = currentGame();
  const setId = document.getElementById('declareSetSelect').value;
  const assignment = {};
  for(const cid of SET_CARD_IDS[setId]){
    if(g.hands[S.mySeat].includes(cid)) assignment[cid]=S.mySeat;
    else {
      const v = S.ui.declareAssign[cid];
      if(v!==undefined && v!=='') assignment[cid]=Number(v);
    }
  }
  S.ui.declareOpen=false;
  if(S.mode==='local'){
    applyDeclare(g, S.mySeat, setId, assignment);
    render();
    maybeRunBotLoop();
  } else {
    S.room.actionQueue.push({type:'DECLARE', seat:S.mySeat, setId, assignment, ts:Date.now()});
    S.room.version++;
    await roomSet(S.roomCode, S.room);
    if(S.mode==='online-host') hostRefereeTick();
    render();
  }
}

/* ---------- DISPATCH ---------- */
function attachHandlers(){
  if(S.screen==='home') attachHomeHandlers();
  else if(S.screen==='lobby') attachLobbyHandlers();
  else if(S.screen==='game') attachGameHandlers();
}

render();
</script>
